# Keeps the SHA-pinned actions in .github/workflows fresh: Dependabot
# understands `uses: owner/repo@<sha> # vX.Y.Z` lines and PRs bumps with the
# comment updated, so pinning doesn't mean freezing.
#
# Every section sets `rebase-strategy: disabled`: by default Dependabot
# rebases its open PRs whenever main moves, and each rebase reruns the whole
# CI. Comment `@dependabot rebase` on a PR when it is about to be merged.
# All three sections run monthly, which Dependabot schedules on the 1st, so
# the month's PRs arrive together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    rebase-strategy: disabled
    # One PR for the month's action bumps instead of one per action.
    groups:
      actions:
        patterns: ["*"]
  # Surfaces RustSec-relevant dependency bumps as PRs. Grouped so routine
  # transitive churn (the eframe/wgpu tree) arrives as one reviewable PR.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    rebase-strategy: disabled
    groups:
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # The RustCrypto block ciphers, modes, MACs, hashes and KDFs moved to
      # one trait generation together (cipher 0.5 / digest 0.11 /
      # rand_core 0.10): aes 0.9, cbc 0.2, des 0.9, rc2 0.9, cipher 0.5,
      # hmac 0.13, sha2 0.11, aes-gcm 0.11, pbkdf2 0.13, scrypt 0.12, with
      # getrandom 0.4 as the OS random source. Their patches are welcome; a
      # next breaking generation moves as one deliberate upgrade, never one
      # crate alone (aes-gcm 0.11 once arrived solo with CI red across the
      # board).
      - dependency-name: aes
        versions: ['>=0.10']
      - dependency-name: cbc
        versions: ['>=0.3']
      - dependency-name: des
        versions: ['>=0.10']
      - dependency-name: rc2
        versions: ['>=0.10']
      - dependency-name: cipher
        versions: ['>=0.6']
      - dependency-name: hmac
        versions: ['>=0.14']
      - dependency-name: sha2
        versions: ['>=0.12']
      - dependency-name: aes-gcm
        versions: ['>=0.12']
      - dependency-name: pbkdf2
        versions: ['>=0.14']
      - dependency-name: scrypt
        versions: ['>=0.13']
      - dependency-name: getrandom
        versions: ['>=0.5']
      # rsa 0.9 (the scoped RSA exception) still takes the rand 0.8 /
      # rand_core 0.6 interfaces; keyroost-rsakey's tests feed it rand 0.8.
      # Drop when a stable rsa 0.10 ships (only release candidates so far).
      - dependency-name: rand
        versions: ['>=0.9']
      # rsa itself: keyroost-pgpkey signs and generates through rsa 0.9's own
      # sha2 / rand_core re-exports, so 0.10 is a deliberate upgrade too.
      - dependency-name: rsa
        versions: ['>=0.10']
      # p256, p384, p521 and k256 moved to elliptic-curve 0.14 together
      # (#212); their 0.14.x patches are welcome. They share one
      # `ToSec1Point` trait (from p256's re-export) in keyroost-pivtest and
      # keyroost-pgpkey, so a next breaking release moves all four at once,
      # never one alone.
      - dependency-name: p256
        versions: ['>=0.15']
      - dependency-name: p384
        versions: ['>=0.15']
      - dependency-name: k256
        versions: ['>=0.15']
      - dependency-name: p521
        versions: ['>=0.15']
      # The dalek crates (Ed25519 / X25519 in keyroost-p12, -pgpkey and
      # -pivtest) moved to 3.x / curve25519-dalek 5 with the RustCrypto
      # generation above (they share sha2 0.11 / rand_core 0.10); a next
      # major moves the same deliberate way.
      - dependency-name: ed25519-dalek
        versions: ['>=4']
      - dependency-name: x25519-dalek
        versions: ['>=4']
      - dependency-name: curve25519-dalek
        versions: ['>=6']
      # eframe pins its own egui version, so the pair can only move in
      # lock-step, and a multi-version egui jump needs hand-migration of the
      # GUI code — an upgrade to do deliberately, not via single-crate bumps.
      # v0.7.3 already made the deliberate jump to 0.35; defer the next one.
      - dependency-name: eframe
        versions: ['>=0.36']
      - dependency-name: egui
        versions: ['>=0.36']
      # The Windows-only direct wgpu dep only picks backends; its version must
      # stay the one eframe 0.35's egui-wgpu uses, so it moves with eframe.
      - dependency-name: wgpu
        versions: ['>=30']
  # Keeps the flake.lock inputs (nixpkgs, flake-parts) fresh for the Nix
  # packaging added in #109. Grouped so all input bumps arrive as one
  # reviewable PR, like the cargo tree above.
  - package-ecosystem: "nix"
    directory: /
    schedule:
      interval: monthly
    rebase-strategy: disabled
    groups:
      flake-inputs:
        patterns: ["*"]
