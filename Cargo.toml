[workspace]
resolver = "2"
# The cargo-fuzz harness is its own workspace so libfuzzer-sys (and its
# nightly requirement) never enters the main dependency tree.
exclude = ["fuzz"]
members = [
    "crates/keyroost-proto",
    "crates/keyroost-transport",
    "crates/keyroost-hid",
    "crates/keyroost-ctap",
    "crates/keyroost-keyring",
    "crates/keyroost-resolve",
    "crates/keyroost-oath",
    "crates/keyroost-vault",
    "crates/keyroost-openpgp",
    "crates/keyroost-piv",
    "crates/keyroost-pivtest",
    "crates/keyroost-p12",
    "crates/keyroost-token2otp",
    "crates/keyroost-feitianotp",
    "crates/keyroost-token2prog",
    "crates/keyroost-rsakey",
    "crates/keyroost-pgpkey",
    "crates/keyroost-qr",
    "crates/keyroost-import",
    "crates/keyroost-winwebauthn",
    "crates/keyroost-screengrab",
    "crates/keyroost-windevtree",
    "crates/keyroostctl",
    "crates/keyroost",
]

[workspace.package]
version = "0.16.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/framefilter/keyroost"

[workspace.lints.rust]
unsafe_code = "forbid"
# cargo-fuzz builds with `--cfg fuzzing`; keyroost-p12 lowers its KDF limits
# under it so the fuzz target is not stalled by hostile files.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

# This workspace spends its time parsing device- and file-supplied bytes;
# a length-arithmetic bug should panic loudly in release builds, not wrap
# silently into an exploitable miscalculation. The cost is negligible for
# a tool that is I/O-bound on a smart card.
[profile.release]
overflow-checks = true

# Temporary, until a hidapi release carries the fix: hidapi 2.6.7 plus the
# one commit proposed in ruabmbua/hidapi-rs#189. With the `windows-native`
# backend, `HidApi::new()` panics ("Slice is not null terminated") on an
# affected Windows PC while it lists HID devices, which is the first thing
# any keyroost command touching HID does. The commit changes two files of
# that backend and nothing else. The commit is carried on the
# `keyroost-windows-serial-fallback-fix` branch of framefilter/hidapi-rs, a
# fork of the official repository kept only for this; leave that branch as
# it is while this section exists. It applies to builds from this repository
# only: a `cargo install` from crates.io resolves hidapi as published.
# To drop it: delete this section and the `outputHashes` entry in flake.nix,
# then run `cargo update -p hidapi`.
[patch.crates-io]
hidapi = { git = "https://github.com/framefilter/hidapi-rs", rev = "625b3ec01ba57fde9103c33fa840718b03c0f0e8" }
