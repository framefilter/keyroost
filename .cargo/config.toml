# Link the MSVC C runtime statically, so keyroost.exe and keyroostctl.exe
# start on a Windows install without the Visual C++ redistributable (they
# otherwise exit at once with STATUS_DLL_NOT_FOUND for vcruntime140.dll).
# winget still declares the redistributable as a dependency; that is harmless.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
