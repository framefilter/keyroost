[package]
name = "keyroost-resolve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared security-key identity resolution (USB + CCID serials) over the keyring."

[features]
# Test-only switch for the #51 matching-equivalence check: with it compiled
# in, KEYROOST_MATCH_TEST=identity-only disables the topology and vendor
# steps. Release builds never enable it.
match-test-switch = []

[lints]
workspace = true

[dependencies]
keyroost-keyring = { path = "../keyroost-keyring", version = "0.12.0" }
keyroost-hid = { path = "../keyroost-hid", version = "0.12.0" }
# Reads the name a key stores on itself (large-blob label entry) during a scan.
keyroost-ctap = { path = "../keyroost-ctap", version = "0.12.0" }
keyroost-transport = { path = "../keyroost-transport", version = "0.12.0" }
keyroost-token2prog = { path = "../keyroost-token2prog", version = "0.12.0" }
keyroost-proto = { path = "../keyroost-proto", version = "0.12.0" }
keyroost-openpgp = { path = "../keyroost-openpgp", version = "0.12.0" }
keyroost-token2otp = { path = "../keyroost-token2otp", version = "0.12.0" }

[dev-dependencies]
# Test builds resolve the config dir to a temp dir, never the real one.
keyroost-keyring = { path = "../keyroost-keyring", version = "0.12.0", features = ["test-isolation"] }
