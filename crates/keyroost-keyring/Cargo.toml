[package]
name = "keyroost-keyring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Friendly-name registry and device-identity resolution for security keys."

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# In-tree SHA-256 (no external deps) for HMAC-SHA-256 fingerprints.
keyroost-proto = { path = "../keyroost-proto", version = "0.12.0" }
# OS randomness for the per-computer salt; already in Cargo.lock (0.2.17).
getrandom = "0.2"
