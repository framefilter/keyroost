[package]
name = "keyroost-pgpkey"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-side OpenPGP key sets for keyroost: keygen, GnuPG-compatible backups, restore and expiry changes."

[lints]
workspace = true

[dependencies]
# Scoped crypto exception (see CLAUDE.md): key generation and signing are
# not something to hand-roll. Everything here except k256 was already in the
# workspace for keyroost-pivtest / keyroost-ctap.
keyroost-proto = { path = "../keyroost-proto", version = "0.13.0" }
keyroost-openpgp = { path = "../keyroost-openpgp", version = "0.13.0" }
# Only with the `card` feature: the restore-onto-a-card glue.
keyroost-transport = { path = "../keyroost-transport", version = "0.13.0", optional = true }
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
p384 = { version = "0.13", features = ["ecdsa", "ecdh"] }
p521 = { version = "0.14", features = ["ecdsa", "ecdh"] }
k256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
aes = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["alloc", "zeroize_derive"] }

[features]
# `card`: import key sets onto an OpenPGP card (`keyroost_pgpkey::card`).
# Off by default so the key/backup core builds without PC/SC.
card = ["dep:keyroost-transport"]
