[package]
name = "keyroost-p12"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-side PKCS#12 (.p12/.pfx) reader that turns an entry into key parts for PIV import."
# The fixtures are throwaway test keys; they stay in the repository, and so
# do the integration tests that read them.
exclude = ["tests/"]

[lints]
workspace = true

[dependencies]
keyroost-proto = { path = "../keyroost-proto", version = "0.14.0" }
keyroost-piv = { path = "../keyroost-piv", version = "0.14.0" }
# Legacy PKCS#12 files encrypt with 40-bit RC2 / 3DES under a SHA-1 KDF and
# MAC; modern ones use PBES2 (PBKDF2 + AES-CBC). `rc2` is the one crate here
# that is new to the workspace tree; it is pinned to the `cipher 0.4` line the
# other block-cipher crates already use.
rc2 = "=0.8.1"
des = "0.8"
cbc = "0.1"
aes = "0.8"
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# Parsing the PKCS#8 payload into key parts.
p256 = "0.14"
p384 = "0.14"
ed25519-dalek = "2"
x25519-dalek = "2"
# Checks that an RSA key's parts agree before it can reach a card.
# `RsaPrivateKey::from_components` validates only since 0.9.7, and 0.9.10
# fixed a panic on a prime equal to 1.
rsa = "0.9.10"
zeroize = "1"
keyroost-oath = { path = "../keyroost-oath", version = "0.14.0" }
