[package]
name = "keyroost-winwebauthn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows helper: detect a FIDO key and open Windows' security-key settings, without admin; plus the CLI's console and terminal guards for showing a password."

# This crate is a deliberate exception to the workspace-wide
# forbid(unsafe_code): it is a thin FFI shim over Windows' HID enumeration,
# the shell and the console, and over the Unix signal and terminal calls the
# CLI needs to erase a shown password on Ctrl+C. The unsafe is confined to
# src/sys.rs (Windows) and src/unix.rs (Unix), and to this crate.
[lints.rust]
unsafe_code = "allow"

# Unix: sigaction / tcsetattr / write / _exit for the Ctrl+C erase. Already in
# the tree (rpassword and rtoolbox use it); the lock file's version.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows-only. On other platforms the Windows entry points are inert (return
# empty / Unsupported), so callers can depend on the crate unconditionally and
# gate behavior at runtime; the Unix Ctrl+C erase is the one non-Windows part.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",                            # SECURITY_ATTRIBUTES (CreateFileW param)
    "Win32_UI_WindowsAndMessaging",              # SW_SHOWNORMAL
    "Win32_UI_Shell",                            # ShellExecuteW (ms-settings: launch)
    "Win32_Devices_DeviceAndDriverInstallation", # SetupDi* (HID enumeration)
    "Win32_Devices_HumanInterfaceDevice",        # HidD_* / HidP_GetCaps (usage page)
    "Win32_Storage_FileSystem",                  # CreateFileW (open HID for caps)
    "Win32_System_Console",                      # Get/SetConsoleMode (VT for the CLI's erase)
] }
